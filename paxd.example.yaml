# paxd configuration
# See README.md for full documentation.

agent:
  machine_type: unknown
  hostname: ""

cloud:
  api_url: https://fleet.example.com
  api_key: ""

hermes:
  api_endpoint: http://localhost:8642
  api_key_from_env: ~/.hermes/.env
  profile: ""

daemon:
  poll_interval: 5s
  status_interval: 10s
  reconcile_interval: 15s
  log_level: info
  db_path: ~/.pax/paxd.db

acp_forwarder:
  enabled: false
  # Example: ["gemini", "--experimental-acp"]
  command: []
  working_dir: ""
  tunnel_path: /api/v1/agent/tunnel
  reconnect_interval: 2s
